          <input type="text" placeholder="Search the web or enter a URL [Ctrl + K]" id="search-input-${newTabIndex}">
          <i class="fas fa-search search-iconaa"></i>
        </div>`;
        
    document.body.appendChild(newContent);

    tabs.push({
        url: 'astral://start',
        content: newContent.innerHTML
    });

    updateActiveTab(newTab, newContent, newTabIndex);
    addCloseButtonFunctionality(newTab);
    addTabClickListener(newTab, newContent, newTabIndex);
}

document.getElementById('add-tabaa').addEventListener('click', createNewTab);

function addCloseButtonFunctionality(tab) {
    tab.querySelector('.close-btnaa').addEventListener('click', function(event) {
        event.stopPropagation();
        closeTab(tab);
    });
}

function closeTab(tab) {
    const index = Array.from(document.querySelectorAll('.tabaa')).indexOf(tab);
    tab.remove();
    document.querySelectorAll('.tab-contentaa')[index].remove();
    tabs.splice(index, 1);

    if (index === currentTabIndex) {
        if (index > 0) {
            currentTabIndex = index - 1;
        } else if (tabs.length > 0) {
            currentTabIndex = 0;
        } else {
            createNewTab();
            return;
        }
        const newActiveTab = document.querySelectorAll('.tabaa')[currentTabIndex];
        const newActiveContent = document.querySelectorAll('.tab-contentaa')[currentTabIndex];
        updateActiveTab(newActiveTab, newActiveContent, currentTabIndex);
    } else if (index < currentTabIndex) {
        currentTabIndex--;
    }
}

function addTabClickListener(tab, content, index) {
    tab.addEventListener('click', function() {
        updateActiveTab(tab, content, index);
    });
}

function updateActiveTab(tab, content, index) {
    document.querySelectorAll('.tab-contentaa').forEach(c => c.classList.remove('activeaa'));
    document.querySelectorAll('.tabaa').forEach(t => t.classList.remove('activeaa'));

    tab.classList.add('activeaa');
    content.classList.add('activeaa');

    currentTabIndex = index;
    const url = tabs[index].url;
    document.getElementById('url-baraa').value = url;
    updateLockIcon(url);
    updateSpecialDivs(url);
}

// Pass top bar inputs to the smart SearchOrNavigation handler to fix Google appending https://
document.getElementById('url-baraa').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
        handleSearchOrNavigation(e.target.value, currentTabIndex);
    }
});

document.addEventListener('click', function(event) {
    if (event.target.classList.contains('search-iconaa')) {
        const inputElem = event.target.closest('.search-baraa').querySelector('input');
        if(inputElem) handleSearchOrNavigation(inputElem.value, currentTabIndex);

});

document.addEventListener('keydown', function(event) {
    if (event.key === 'Enter' && event.target.id.startsWith('search-input-')) {
        const tabIndex = parseInt(event.target.id.split('-')[2]);
        handleSearchOrNavigation(event.target.value, tabIndex);
    }
});

function handleSearchOrNavigation(input, tabIndex) {
    let url = input.trim();
    if (!url) return;

    // Smart logic to detect if it's a raw search or a URL
    if (!input.includes(' ') && /^(https?:\/\/)?[\w\-]+(\.[\w\-]+)+[/#?]?.*$/.test(url)) {
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        changeTabContent(url);
    } else {
        const engineImg = document.getElementById(`selected-engine-${tabIndex}`);
        const engineAlt = engineImg ? engineImg.alt : 'Google';
        let searchUrl = '';

        switch(engineAlt) {
            case 'Bing': searchUrl = `https://www.bing.com/search?q=${encodeURIComponent(input)}`; break;
            case 'DuckDuckGo': searchUrl = `https://duckduckgo.com/?q=${encodeURIComponent(input)}`; break;
            default: searchUrl = `https://www.google.com/search?q=${encodeURIComponent(input)}`;
        }
        changeTabContent(searchUrl);
    }
}

async function fetchExternalContent(url, content, tabIndex) {
    const tab = document.querySelectorAll('.tabaa')[tabIndex];
    
    // Utilize multiple proxies to prevent silent failures (like AllOrigins breaking on Google searches)
    const proxies = [
        `https://api.cors.lol/?url=${encodeURIComponent(url)}`,
        `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
    ];

    let htmlText = null;
    for (const proxy of proxies) {
        try {
            const response = await fetch(proxy);
            if (response.ok) {
                htmlText = await response.text();
                break;
            }
        } catch (err) {
            console.warn('Proxy failed:', proxy);
        }
    }

    if (!htmlText) {
        content.innerHTML = `<div class="glass-panel" style="padding: 20px; color: #fff; margin: auto; border-radius: 10px;"><h3>Error loading content</h3><p class="detail-text">Failed to fetch the requested URL. Please try again or check the URL.</p></div>`;
        hideSpinner(tab);
        return;
    }
    
    try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        tab.querySelector('.tab-nameaa').textContent = doc.title || 'Untitled';
        
        const shadowContainer = document.createElement('div');
        shadowContainer.style.width = '100%';
        shadowContainer.style.height = '100%';
        shadowContainer.style.overflow = 'auto';
        shadowContainer.style.backgroundColor = '#fff'; // Standard web background for iframes/shadow dom
        
        const shadowRoot = shadowContainer.attachShadow({ mode: 'open' });
        shadowRoot.innerHTML = htmlText;

        // Fix Bug 2: Intercept internal clicks so the URL bar physically updates when you navigate within the proxy
        shadowRoot.querySelectorAll('a').forEach(anchor => {
            anchor.addEventListener('click', (event) => {
                event.preventDefault();
                let href = anchor.getAttribute('href');
                if (href && !href.startsWith('javascript:')) {
                    try {
                        const newUrl = new URL(href, url).href;
                        updateTabContent(newUrl, content, tab);
                    } catch(e) {
                        console.error('Failed to parse URL:', e);
                    }
                }
            });
        });
        
        content.innerHTML = '';
        content.appendChild(shadowContainer);
        hideSpinner(tab);
    } catch (err) {
        content.innerHTML = `<div class="glass-panel" style="padding: 20px; color: #fff; margin: auto; border-radius: 10px;"><h3>Error parsing content</h3><p class="detail-text">${err.message}</p></div>`;
        hideSpinner(tab);
    }
}

function showSpinner(tabElement) {
    let tabName = tabElement.querySelector('.tab-nameaa');
    if (!tabName.querySelector('.spinner')) {
        let spinner = document.createElement('div');
        spinner.className = 'spinner';
        tabName.insertBefore(spinner, tabName.firstChild);
    }
}

function hideSpinner(tabElement) {
    let spinner = tabElement.querySelector('.spinner');

}
