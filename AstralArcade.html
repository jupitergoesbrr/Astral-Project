<!DOCTYPE html>
<html lang="en">
<head>
    <base href="https://cdn.jsdelivr.net/gh/freebuisness/gn-math-DONTDMCA@main/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jupiter's Repository</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #50065c;
            --primary-glow: rgba(80, 6, 92, 0.6);
            --bg: #000000;
            --surface: rgba(20, 20, 20, 0.7);
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(80, 6, 92, 0.35);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            overflow-x: hidden;
            font-size: 13px;
        }

        /* --- Header & Logo --- */
        header {
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 0.7rem 0;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
            gap: 1.5rem;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900; /* Thicker Sans Serif */
            letter-spacing: -0.5px;
            color: #fff;
            white-space: nowrap;
            text-transform: uppercase;
            text-shadow: 0 0 12px var(--primary-glow);
        }

        .search-container {
            display: flex;
            flex: 1;
            max-width: 500px;
            gap: 8px;
        }

        input, select {
            background: var(--glass);
            border: 1px solid var(--border);
            color: white;
            padding: 0.5rem 0.8rem;
            border-radius: 6px;
            outline: none;
            font-size: 0.8rem;
            transition: 0.3s;
        }

        input:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }

        /* --- Trending Today Section --- */
        .trending-section {
            max-width: 1200px;
            margin: 1.5rem auto;
            padding: 0 1.5rem;
            position: relative;
        }

        .section-label {
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #b186bd;
            margin-bottom: 0.8rem;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label::before {
            content: '';
            width: 4px;
            height: 12px;
            background: var(--primary);
            border-radius: 2px;
        }

        .carousel-outer {
            position: relative;
            background: rgba(255,255,255,0.015);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 0.5rem;
        }

        .carousel-track {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            gap: 12px;
            padding: 5px;
            scrollbar-width: none;
        }
        .carousel-track::-webkit-scrollbar { display: none; }

        .carousel-card {
            width: 100px; /* Uniform Small Size */
            flex: 0 0 auto;
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .carousel-card img {
            width: 100px;
            height: 140px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid transparent;
            background: #111;
        }

        .carousel-card:hover { transform: translateY(-5px); }
        .carousel-card:hover img { border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

        .carousel-card .title {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 6px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(0,0,0,0.85);
            border: 1px solid var(--border);
            color: white;
            cursor: pointer;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }
        .prev { left: -14px; }
        .next { right: -14px; }

        /* --- Library Grid --- */
        main {
            max-width: 1200px;
            margin: 0 auto 120px;
            padding: 0 1.5rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1.2rem;
        }

        .game-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
        }

        .game-card:hover {
            border-color: var(--primary);
            transform: scale(1.02);
            background: rgba(80, 6, 92, 0.05);
        }

        .game-card img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #111; }
        .game-info { padding: 0.5rem; text-align: center; font-weight: 700; font-size: 0.75rem; }

        /* --- Footer --- */
        footer {
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            padding: 1.5rem;
            text-align: center;
            position: fixed;
            bottom: 0; width: 100%;
            z-index: 900;
        }

        .credit { font-size: 0.75rem; color: var(--text-muted); }
        .credit b { color: #fff; text-shadow: 0 0 5px var(--primary-glow); }

        /* --- Viewer --- */
        #viewer { position: fixed; inset: 0; background: #000; z-index: 2000; display: none; flex-direction: column; }
        iframe { flex: 1; border: none; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="logo">Jupiter's Repository</div>
            <div class="search-container">
                <input type="text" id="searchBar" placeholder="Search games..." oninput="filterGames()">
                <select id="filterOptions" onchange="filterByCategory()">
                    <option value="none">Filter By Category</option>
                </select>
            </div>
            <button onclick="listGames()" style="background:var(--primary); color:white; border:none; padding: 6px 12px; border-radius:6px; cursor:pointer; font-weight:700;">Refresh</button>
        </div>
    </header>

    <div class="trending-section">
        <div class="section-label">Trending Today</div>
        <div class="carousel-outer">
            <button class="nav-btn prev" onclick="scrollCarousel(-1)">&#10094;</button>
            <div id="carouselTrack" class="carousel-track">
                </div>
            <button class="nav-btn next" onclick="scrollCarousel(1)">&#10095;</button>
        </div>
    </div>

    <main>
        <div class="section-label" style="color: var(--text-muted); margin-top: 2rem;">Game Library</div>
        <div id="gameGrid" class="grid-container">
            </div>
    </main>

    <div id="viewer">
        <div style="background: var(--primary); padding: 8px 15px; display: flex; justify-content: space-between; align-items: center;">
            <div id="activeTitle" style="font-weight: 900; font-size: 0.85rem; letter-spacing: 1px;">LOADING GAME...</div>
            <button onclick="closeGame()" style="background: #000; color: #fff; border: 1px solid #fff; padding: 4px 12px; cursor: pointer; border-radius: 4px; font-weight:700;">CLOSE</button>
        </div>
        <iframe id="gameFrame"></iframe>
    </div>

    <footer>
        <div class="credit">Powered by <b>GN-Math</b> &bull; Created by <b>Genizy</b></div>
        <div style="font-size: 0.65rem; color: #444; margin-top: 5px;">Jupiter's Repository &copy; 2026</div>
    </footer>

    <script>
        const grid = document.getElementById('gameGrid');
        const track = document.getElementById('carouselTrack');
        const viewer = document.getElementById('viewer');
        const frame = document.getElementById('gameFrame');
        
        const coverURL = "https://cdn.jsdelivr.net/gh/freebuisness/covers@main";
        const htmlURL = "https://cdn.jsdelivr.net/gh/freebuisness/html@main";
        
        // Target list for Trending Today
        const trendingTargetNames = [
            "Temple Run", "Minecraft", "Bowmasters", "Fireboy and Watergirl", 
            "Subway Surfers", "Retro Bowl", "1v1.lol", "Among Us", 
            "Drive Mad", "Slope", "Geometry Dash", "BitLife", 
            "Vex 4", "Vex 5", "Tunnel Rush", "Crossy Road"
        ];

        let games = [];

        async function listGames() {
            try {
                const response = await fetch("https://cdn.jsdelivr.net/gh/freebuisness/assets@main/zones.json?t=" + Date.now());
                games = await response.json();
                
                // Populate Categories
                const cats = [...new Set(games.flatMap(g => g.special || []))];
                cats.forEach(c => {
                    const o = document.createElement('option');
                    o.value = c; o.textContent = c.toUpperCase();
                    document.getElementById('filterOptions').appendChild(o);
                });

                renderUI(games);
            } catch (e) { grid.innerHTML = "Network Error."; }
        }

        function renderUI(data) {
            grid.innerHTML = "";
            track.innerHTML = "";

            // 1. Render Library Grid
            data.forEach(game => {
                const imgPath = game.cover.replace("{COVER_URL}", coverURL);
                const card = document.createElement('div');
                card.className = "game-card";
                card.onclick = () => openGame(game);
                card.innerHTML = `<img src="${imgPath}" alt="${game.name}"><div class="game-info">${game.name}</div>`;
                grid.appendChild(card);
            });

            // 2. Render Smart Trending Carousel
            // Filter games that match our target list first
            let trendingList = data.filter(g => 
                trendingTargetNames.some(name => g.name.toLowerCase().includes(name.toLowerCase()))
            );

            // Fill the rest with 'featured' or just the first few until we hit at least 15
            if (trendingList.length < 15) {
                const remaining = data.filter(g => !trendingList.includes(g));
                trendingList = [...trendingList, ...remaining.slice(0, 15 - trendingList.length)];
            }

            trendingList.forEach(game => {
                const imgPath = game.cover.replace("{COVER_URL}", coverURL);
                const fCard = document.createElement('div');
                fCard.className = "carousel-card";
                fCard.onclick = () => openGame(game);
                fCard.innerHTML = `<img src="${imgPath}"><div class="title">${game.name}</div>`;
                track.appendChild(fCard);
            });
        }

        function openGame(game) {
            const url = game.url.replace("{HTML_URL}", htmlURL);
            fetch(url).then(r => r.text()).then(html => {
                viewer.style.display = "flex";
                document.getElementById('activeTitle').textContent = game.name.toUpperCase();
                frame.contentDocument.open();
                frame.contentDocument.write(html);
                frame.contentDocument.close();
            });
        }

        function closeGame() { viewer.style.display = "none"; frame.src = "about:blank"; }

        function scrollCarousel(dir) { track.scrollLeft += dir * 250; }

        function filterGames() {
            const q = document.getElementById('searchBar').value.toLowerCase();
            renderUI(games.filter(g => g.name.toLowerCase().includes(q)));
        }

        function filterByCategory() {
            const c = document.getElementById('filterOptions').value;
            if(c === "none") return renderUI(games);
            renderUI(games.filter(g => g.special && g.special.includes(c)));
        }

        window.onload = listGames;
    </script>
</body>
</html>
