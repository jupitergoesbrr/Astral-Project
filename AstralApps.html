<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astral Apps</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        :root {
            --primary-purple: #50065c;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(80, 6, 92, 0.5);
            --transition-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Inter', sans-serif;
            color: white; background-color: #000;
            overflow: hidden;
        }

        canvas { position: fixed; top: 0; left: 0; z-index: 0; display: block; }

        .hub-wrapper {
            position: relative; z-index: 1;
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.5) 100%);
        }

        header { text-align: center; margin-bottom: 40px; animation: slideIn 0.8s var(--transition-bounce) forwards; }
        h1 { font-weight: 300; letter-spacing: 8px; text-transform: uppercase; font-size: 2.8rem; text-shadow: 0 0 25px rgba(80, 6, 92, 0.8); }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 25px;
            width: 90%;
            max-width: 1000px;
            animation: slideIn 0.8s var(--transition-bounce) 0.1s forwards;
        }

        .app-card {
            display: flex; flex-direction: column; align-items: center;
            cursor: pointer; transition: transform 0.4s var(--transition-bounce);
        }

        .app-card:hover { transform: scale(1.05) translateY(-5px); }

        /* The Image Container (The Box) */
        .img-box {
            width: 180px; height: 180px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 2px solid var(--glass-border);
            border-radius: 15px;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 12px;
            transition: border-color 0.3s;
        }

        .app-card:hover .img-box { border-color: #7a098d; background: rgba(80, 6, 92, 0.2); }

        .img-box img {
            width: 100%; height: 100%;
            object-fit: cover; /* Makes image fill the square nicely */
            opacity: 0.8;
            transition: opacity 0.3s;
        }

        .app-card:hover .img-box img { opacity: 1; }

        /* The Text Label Below */
        .app-label {
            font-size: 0.9rem; font-weight: 400;
            letter-spacing: 1px; color: #f0e0ff;
            text-align: center;
        }

        /* Window System Remains Unchanged */
        .window {
            position: absolute; background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(25px); border: 2px solid var(--glass-border);
            border-radius: 20px; display: flex; flex-direction: column;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8); overflow: hidden;
            transition: width 0.3s ease, height 0.3s ease, top 0.3s ease, left 0.3s ease, transform 0.3s ease;
        }

        .window.fullscreen { top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; border-radius: 0; z-index: 10000 !important; transform: translate(0, 0) !important; }
        .window.minimized { height: 55px !important; width: 300px !important; }
        .window-header { padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; background: rgba(80, 6, 92, 0.3); border-bottom: 1px solid var(--glass-border); cursor: move; user-select: none; }
        .window-title { font-size: 0.85rem; color: #f0e0ff; }
        .controls { display: flex; gap: 8px; }
        .control-btn { background: var(--primary-purple); color: white; border: none; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .control-btn:hover { filter: brightness(1.4); }
        .window-content { flex-grow: 1; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <script type="importmap"> { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } } </script>
    <script type="module">
        import * as THREE from 'three';
        const PARTICLE_COUNT = 300, MAX_DISTANCE = 150, COLOR = 0x50065c;
        let scene, camera, renderer, particles, lines, positions, velocities;
        let mouse = new THREE.Vector2(), targetRotation = new THREE.Vector2();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = 500;
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);
            const geometry = new THREE.BufferGeometry();
            positions = new Float32Array(PARTICLE_COUNT * 3); velocities = new Float32Array(PARTICLE_COUNT * 3);
            for (let i = 0; i < PARTICLE_COUNT * 3; i++) { positions[i] = (Math.random() - 0.5) * 1000; velocities[i] = 0; }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particles = new THREE.Points(geometry, new THREE.PointsMaterial({ color: COLOR, size: 4, transparent: true, opacity: 0.8 }));
            scene.add(particles);
            lines = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: COLOR, transparent: true, opacity: 0.2 }));
            scene.add(lines);
            window.addEventListener('mousemove', (e) => {
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                targetRotation.x = mouse.y * -0.5; targetRotation.y = mouse.x * 0.5;
            });
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
        function animate() {
            requestAnimationFrame(animate);
            particles.rotation.x += (targetRotation.x - particles.rotation.x) * 0.05;
            particles.rotation.y += (targetRotation.y - particles.rotation.y) * 0.05;
            lines.rotation.copy(particles.rotation);
            const posAttr = particles.geometry.attributes.position;
            for (let i = 0; i < PARTICLE_COUNT * 3; i++) { posAttr.array[i] += velocities[i]; velocities[i] *= 0.95; }
            posAttr.needsUpdate = true;
            const lp = []; const pa = posAttr.array;
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                for (let j = i + 1; j < PARTICLE_COUNT; j++) {
                    const dx = pa[i*3]-pa[j*3], dy = pa[i*3+1]-pa[j*3+1], dz = pa[i*3+2]-pa[j*3+2];
                    if (Math.sqrt(dx*dx+dy*dy+dz*dz) < MAX_DISTANCE) { lp.push(pa[i*3], pa[i*3+1], pa[i*3+2], pa[j*3], pa[j*3+1], pa[j*3+2]); }
                }
            }
            lines.geometry.setAttribute('position', new THREE.Float32BufferAttribute(lp, 3));
            renderer.render(scene, camera);
        }
        init(); animate();
    </script>

    <div class="hub-wrapper">
        <header><h1>Astral Apps</h1></header>
        <div class="app-grid">
            <div class="app-card" 
                 data-code="https://cdn.jsdelivr.net/gh/freebuisness/freebuisness.github.io@main/singlefile.html?t=" 
                 data-img="https://cdn.jsdelivr.net/gh/jupitergoesbrr/Astral-Project@main/gnmath.gif">
                <div class="img-box"><img src="" alt=""></div>
                <span class="app-label">GN-Math</span>
            </div>

            <div class="app-card" 
                 data-code="https://cdn.jsdelivr.net/gh/jupitergoesbrr/Astral-Project@main/clSINGLEFILE.html?t=" 
                 data-img="https://cdn.jsdelivr.net/gh/jupitergoesbrr/Astral-Project@main/UGS.png">
                <div class="img-box"><img src="" alt=""></div>
                <span class="app-label">UGS</span>
            </div>

            <div class="app-card" 
                 data-code="https://cdn.jsdelivr.net/gh/virtuan4-max/ghostlinkhub@main/ghostlinksinglefile.html?t=" 
                 data-img="https://cdn.jsdelivr.net/gh/jupitergoesbrr/Astral-Project@main/ghostslink.png">
                <div class="img-box"><img src="" alt=""></div>
                <span class="app-label">Ghostlink</span>
            </div>

            <div class="app-card" 
                 data-code="https://cdn.jsdelivr.net/gh/jupitergoesbrr/Astral-Project@main/shooym.html?t=" 
                 data-img="https://cdn.jsdelivr.net/gh/jupitergoesbrr/Astral-Project@main/shooym.jpg">
                <div class="img-box"><img src="" alt=""></div>
                <span class="app-label">Shyoom</span>
            </div>
        </div>
    </div>

    <div id="window-layer"></div>

    <script>
        const windowLayer = document.getElementById('window-layer');
        let zStack = 100;

        // Automatically set image sources from data-img
        document.querySelectorAll('.app-card').forEach(card => {
            const img = card.querySelector('img');
            img.src = card.getAttribute('data-img');
            
            card.addEventListener('click', () => {
                createWindow(card.querySelector('.app-label').innerText, card.getAttribute('data-code'));
            });
        });

        async function createWindow(name, url) {
            zStack++;
            const win = document.createElement('div');
            win.className = 'window';
            win.style.zIndex = zStack;
            win.style.width = "800px";
            win.style.height = "500px";
            win.style.top = "15%";
            win.style.left = "15%";

            win.innerHTML = `
                <div class="window-header">
                    <span class="window-title">${name}</span>
                    <div class="controls">
                        <button class="control-btn min-btn"><span class="material-symbols-outlined">minimize</span></button>
                        <button class="control-btn full-btn"><span class="material-symbols-outlined">fullscreen</span></button>
                        <button class="control-btn close-btn"><span class="material-symbols-outlined">close</span></button>
                    </div>
                </div>
                <div class="window-content"><iframe></iframe></div>
            `;

            windowLayer.appendChild(win);
            const frame = win.querySelector('iframe');
            
            try {
                const response = await fetch(url);
                const code = await response.text();
                const baseUrl = url.substring(0, url.lastIndexOf('/') + 1);
                const doc = frame.contentWindow.document;
                doc.open();
                doc.write(`<html><head><base href="${baseUrl}"><style>body{background:#000;color:white;margin:0;}</style></head><body><script>${code}<\/script></body></html>`);
                doc.close();
            } catch (e) { console.error("Load failed", e); }

            win.querySelector('.close-btn').onclick = () => win.remove();
            win.querySelector('.min-btn').onclick = () => win.classList.toggle('minimized');
            win.querySelector('.full-btn').onclick = () => win.classList.toggle('fullscreen');
            win.onmousedown = () => { if(!win.classList.contains('fullscreen')) win.style.zIndex = ++zStack; };
            makeDraggable(win);
        }

        function makeDraggable(el) {
            let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
            const header = el.querySelector('.window-header');
            header.onmousedown = (e) => {
                if (el.classList.contains('fullscreen')) return;
                p3 = e.clientX; p4 = e.clientY;
                document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
                document.onmousemove = (e) => {
                    p1 = p3 - e.clientX; p2 = p4 - e.clientY;
                    p3 = e.clientX; p4 = e.clientY;
                    el.style.top = (el.offsetTop - p2) + "px";
                    el.style.left = (el.offsetLeft - p1) + "px";
                };
            };
        }
    </script>
</body>
</html>
